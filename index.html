<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prothèse Care — Service universitaire de prothèse dentaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🦷</text></svg>">
</head>
<body>

<div class="app">

  <!-- ================= BARRE LATÉRALE ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">🦷</div>
      <div class="brand-text">
        <span class="brand-name">Prothèse&nbsp;Care</span>
        <span class="brand-sub">Service de prothèse dentaire</span>
      </div>
    </div>

    <nav class="nav">
      <span class="nav-label">Pilotage</span>
      <button class="nav-item active" data-view="dashboard"><span class="nav-ico">▦</span> Tableau de bord</button>
      <button class="nav-item" data-view="patients"><span class="nav-ico">☰</span> Patients <span class="nav-badge" id="badgePatients"></span></button>
      <button class="nav-item" data-view="rendezvous"><span class="nav-ico">🗓</span> Rendez-vous <span class="nav-badge" id="badgeRdv"></span></button>

      <span class="nav-label">Suivi clinique</span>
      <button class="nav-item" data-view="laboratoire"><span class="nav-ico">⚙</span> Laboratoire externe <span class="nav-badge alert" id="badgeLabo"></span></button>
      <button class="nav-item" data-view="poses"><span class="nav-ico">✓</span> Poses &amp; contrôles <span class="nav-badge" id="badgePoses"></span></button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar avatar-teacher">NB</div>
        <div>
          <div class="user-name">Pr Nadia Benali</div>
          <div class="user-role">Chef de service</div>
        </div>
      </div>
      <button class="btn-reset" id="btnReset" title="Remettre les données de démonstration à zéro">↺ Réinitialiser la démo</button>
      <p class="demo-note">Prototype de démonstration — données fictives, ne pas utiliser en situation réelle.</p>
    </div>
  </aside>

  <!-- ================= ZONE PRINCIPALE ================= -->
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Tableau de bord</h1>
        <p id="pageSubtitle" class="page-subtitle"></p>
      </div>
      <div class="topbar-actions">
        <div class="topbar-date" id="topbarDate"></div>
        <button class="btn btn-primary" id="btnNouveauPatient">+ Nouveau patient</button>
      </div>
    </header>

    <section id="view-dashboard" class="view active"></section>
    <section id="view-patients" class="view"></section>
    <section id="view-patient" class="view"></section>
    <section id="view-rendezvous" class="view"></section>
    <section id="view-laboratoire" class="view"></section>
    <section id="view-poses" class="view"></section>
  </main>
</div>

<!-- ================= MODALE : NOUVEAU PATIENT ================= -->
<div class="modal-overlay" id="modalPatient">
  <div class="modal">
    <div class="modal-head">
      <h2>Nouveau patient</h2>
      <button class="modal-close" data-close="modalPatient">✕</button>
    </div>
    <form id="formPatient" class="form">
      <div class="form-grid">
        <label>Nom et prénom *
          <input type="text" name="nom" required placeholder="Ex. Amine Mansouri">
        </label>
        <label>Âge *
          <input type="number" name="age" min="3" max="110" required placeholder="Ex. 58">
        </label>
        <label>Sexe
          <select name="sexe"><option value="F">Femme</option><option value="M">Homme</option></select>
        </label>
        <label>Téléphone
          <input type="text" name="telephone" placeholder="Ex. 0550 00 00 00">
        </label>
        <label class="full">Type de prothèse envisagée *
          <select name="typeProthese" required>
            <option>Prothèse amovible complète bimaxillaire</option>
            <option>Prothèse amovible complète maxillaire</option>
            <option>Prothèse amovible complète mandibulaire</option>
            <option>Prothèse amovible partielle (stellite)</option>
            <option>Prothèse amovible partielle provisoire</option>
            <option>Couronne unitaire céramique</option>
            <option>Couronne unitaire céramo-métallique</option>
            <option>Bridge céramo-métallique 3 éléments</option>
            <option>Prothèse sur implants</option>
          </select>
        </label>
        <label class="full">Motif de consultation
          <textarea name="motif" rows="2" placeholder="Décrivez brièvement le motif…"></textarea>
        </label>
        <label>Étudiant responsable
          <select name="etudiantId" id="selectEtudiantPatient"></select>
        </label>
        <label>Enseignant superviseur
          <select name="enseignantId" id="selectEnseignantPatient"></select>
        </label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-close="modalPatient">Annuler</button>
        <button type="submit" class="btn btn-primary">Créer le dossier</button>
      </div>
    </form>
  </div>
</div>

<!-- ================= MODALE : NOUVEAU RENDEZ-VOUS ================= -->
<div class="modal-overlay" id="modalRdv">
  <div class="modal">
    <div class="modal-head">
      <h2>Nouveau rendez-vous</h2>
      <button class="modal-close" data-close="modalRdv">✕</button>
    </div>
    <form id="formRdv" class="form">
      <div class="form-grid">
        <label class="full">Patient *
          <select name="patientId" id="selectPatientRdv" required></select>
        </label>
        <label>Date *
          <input type="date" name="date" required>
        </label>
        <label>Heure *
          <input type="time" name="heure" required value="09:00">
        </label>
        <label>Durée (minutes)
          <select name="duree"><option>30</option><option selected>45</option><option>60</option><option>90</option></select>
        </label>
        <label>Box
          <select name="box"><option>Box 1</option><option>Box 2</option><option>Box 3</option><option>Box 4</option><option>Box 5</option></select>
        </label>
        <label class="full">Motif du rendez-vous *
          <input type="text" name="motif" required placeholder="Ex. Essayage du montage des dents">
        </label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-close="modalRdv">Annuler</button>
        <button type="submit" class="btn btn-primary">Planifier</button>
      </div>
    </form>
  </div>
</div>

<!-- ================= MODALE : NOUVEL ENVOI LABORATOIRE ================= -->
<div class="modal-overlay" id="modalLabo">
  <div class="modal">
    <div class="modal-head">
      <h2>Nouvel envoi au laboratoire</h2>
      <button class="modal-close" data-close="modalLabo">✕</button>
    </div>
    <form id="formLabo" class="form">
      <div class="form-grid">
        <label class="full">Patient *
          <select name="patientId" id="selectPatientLabo" required></select>
        </label>
        <label class="full">Laboratoire *
          <select name="laboratoireId" id="selectLabo" required></select>
        </label>
        <label class="full">Travail demandé *
          <input type="text" name="travail" required placeholder="Ex. Châssis métallique chrome-cobalt">
        </label>
        <label>Date d'envoi *
          <input type="date" name="dateEnvoi" required>
        </label>
        <label>Retour souhaité *
          <input type="date" name="dateRetourPrevue" required>
        </label>
        <label>Teinte
          <input type="text" name="teinte" placeholder="Ex. A2">
        </label>
        <label class="full">Prescriptions / notes
          <textarea name="notes" rows="2" placeholder="Précisions pour le prothésiste…"></textarea>
        </label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-close="modalLabo">Annuler</button>
        <button type="submit" class="btn btn-primary">Enregistrer l'envoi</button>
      </div>
    </form>
  </div>
</div>

<!-- Notification discrète -->
<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
