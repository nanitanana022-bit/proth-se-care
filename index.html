<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prothèse Care — Service universitaire de prothèse dentaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='10' fill='%230E2B47'/><g transform='translate(12 5)' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3.2c-1.9 0-2.9-.7-4.6-.7C4.7 2.5 3 4.2 3 6.9c0 2 .8 3.4 1.4 5.4.6 2.1 1 5.1 1.6 7.6.3 1.5 2.2 1.6 2.8.2.7-1.7 1.4-3.9 3.2-3.9s2.5 2.2 3.2 3.9c.6 1.4 2.5 1.3 2.8-.2.6-2.5 1-5.5 1.6-7.6.6-2 1.4-3.4 1.4-5.4 0-2.7-1.7-4.4-4.4-4.4-1.7 0-2.7.7-4.6.7Z'/></g><path d='M10 32.5C18.5 38.5 29.5 38.5 38 32.5' fill='none' stroke='%232E9E8F' stroke-width='3.2' stroke-linecap='round'/></svg>">
</head>
<body>

<div class="app">

  <!-- ================= BARRE LATÉRALE ================= -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" aria-hidden="true">
        <!-- Logo Prothèse Care : trois couronnes (bridge) et arc gingival -->
        <svg class="brand-svg" viewBox="0 0 56 46" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Prothèse Care">
          <defs>
            <path id="pc-dent" d="M12 3.2c-1.9 0-2.9-.7-4.6-.7C4.7 2.5 3 4.2 3 6.9c0 2 .8 3.4 1.4 5.4.6 2.1 1 5.1 1.6 7.6.3 1.5 2.2 1.6 2.8.2.7-1.7 1.4-3.9 3.2-3.9s2.5 2.2 3.2 3.9c.6 1.4 2.5 1.3 2.8-.2.6-2.5 1-5.5 1.6-7.6.6-2 1.4-3.4 1.4-5.4 0-2.7-1.7-4.4-4.4-4.4-1.7 0-2.7.7-4.6.7Z"/>
          </defs>
          <g fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <use href="#pc-dent" transform="translate(2 11) scale(0.82)"/>
            <use href="#pc-dent" transform="translate(36.8 11) scale(0.82)"/>
            <use href="#pc-dent" transform="translate(16 6.2)"/>
          </g>
          <path d="M4 32.5C19 41.5 37 41.5 52 32.5" fill="none" stroke="#2E9E8F" stroke-width="3.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">Prothèse <span class="brand-care">Care</span></span>
        <span class="brand-sub">Service de prothèse dentaire</span>
      </div>
    </div>

    <nav class="nav">
      <button class="nav-item active" data-view="dashboard"><span class="nav-ico">▦</span> Tableau de bord</button>
      <button class="nav-item" data-view="patients"><span class="nav-ico">☰</span> Patients <span class="nav-badge" id="badgePatients"></span></button>
    </nav>

    <div class="sidebar-footer">
      <button class="btn-reset" id="btnReset" title="Remettre les données de démonstration à zéro">↺ Réinitialiser la démo</button>
      <p class="demo-note">Prototype de démonstration — données fictives, ne pas utiliser en situation réelle.</p>
    </div>
  </aside>

  <!-- ================= ZONE PRINCIPALE ================= -->
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Tableau de bord</h1>
        <p id="pageSubtitle" class="page-subtitle"></p>
      </div>
      <div class="topbar-actions">
        <div class="topbar-date" id="topbarDate"></div>
      </div>
    </header>

    <section id="view-dashboard" class="view active"></section>
    <section id="view-patients" class="view"></section>
    <section id="view-patient" class="view"></section>
  </main>
</div>

<!-- ================= MODALE : NOUVEAU PATIENT ================= -->
<div class="modal-overlay" id="modalPatient">
  <div class="modal">
    <div class="modal-head">
      <h2>Ajouter un patient</h2>
      <button class="modal-close" data-close="modalPatient">✕</button>
    </div>
    <form id="formPatient" class="form">
      <div class="form-grid">
        <label>Nom et prénom *
          <input type="text" name="nom" required placeholder="Ex. Amine Mansouri">
        </label>
        <label>Âge *
          <input type="number" name="age" min="3" max="110" required placeholder="Ex. 58">
        </label>
        <label>Sexe
          <select name="sexe"><option value="F">Femme</option><option value="M">Homme</option></select>
        </label>
        <label>Téléphone
          <input type="text" name="telephone" placeholder="Ex. 0550 00 00 00">
        </label>
        <label class="full">Adresse
          <input type="text" name="adresse" placeholder="Ex. Rue des Frères Bouadou, Alger">
        </label>
        <label class="full">Type de prothèse envisagée *
          <input type="text" name="traitementEnvisage" required placeholder="Ex. Prothèse amovible complète bimaxillaire">
        </label>
        <label class="full">Motif de consultation
          <textarea name="motif" rows="2" placeholder="Décrivez brièvement le motif de la consultation…"></textarea>
        </label>
        <label class="full">Antécédents
          <textarea name="antecedents" rows="3" placeholder="Antécédents médicaux et dentaires pertinents…"></textarea>
        </label>
        <label class="full">Médecin responsable
          <input type="text" name="medecinResponsable" placeholder="Ex. Dr Karim Boudiaf">
        </label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-close="modalPatient">Annuler</button>
        <button type="submit" class="btn btn-primary">Créer le dossier</button>
      </div>
    </form>
  </div>
</div>

<!-- ================= MODALE : NOUVEAU RENDEZ-VOUS ================= -->
<div class="modal-overlay" id="modalRdv">
  <div class="modal">
    <div class="modal-head">
      <h2>Nouveau rendez-vous</h2>
      <button class="modal-close" data-close="modalRdv">✕</button>
    </div>
    <form id="formRdv" class="form">
      <div class="form-grid">
        <label class="full">Nom du patient
          <input type="text" name="patientNom" id="champPatientRdv" readonly tabindex="-1">
        </label>
        <label class="full">Date et heure du rendez-vous *
          <input type="datetime-local" name="dateHeure" required>
        </label>
        <label class="full">Motif du rendez-vous *
          <input type="text" name="motif" required placeholder="Ex. Essayage des maquettes en bouche">
        </label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" data-close="modalRdv">Annuler</button>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </div>
    </form>
  </div>
</div>

<!-- Notification discrète -->
<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
